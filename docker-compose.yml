services:
  backend:
    build:
      context: ./trivia_server
    container_name: trivia_backend
    ports:
      - "8000:8000"
    volumes:
      - ./trivia_server:/app
    env_file:
      - .env

  frontend:
    build:
      context: ./trivia_front
    container_name: trivia_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./trivia_front:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  frontend_node_modules:
