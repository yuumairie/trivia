openapi: 3.0.0
info:
  title: Unknown
  version: 1.0.0
servers: 
  - url: http://192.168.3.12:8080/v1
paths:
  /trivias:
    get: 
      tags: 
        - trivias
      summary: "トリビア情報API"
      description: "検索された情報を返します"
      parameters:
        - name: "keyword"
          in: query
          description: "検索したいキーワード"
          required: false
          schema: 
            type: string
        - name: "genreId"
          in: query
          description: "検索したいジャンル"
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A JSON array of Trivia model
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: '#/components/schemas/Trivia'
    post:
      tags: 
        - trivias
      summary: トリビア登録API
      description: トリビアを登録します
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: 
                  type: integer
                genreId:
                  type: integer
                content:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trivia'
      security:
        - bearer: []
  /users:
    post:
      tags:
        - users
      description: ユーザを登録します
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                emailAdress:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
    Genre:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Trivia:
      type: object
      properties:
        id:
          type: integer
        userPost:
          $ref: '#/components/schemas/User'
        genre:
          $ref: '#/components/schemas/Genre'
        content:
          type: string
        explanation:
          type: string
        created_at:
          type: string
          description: "フォーマット: yyyy/mm/dd"
        good:
          type: array
          description: "この投稿をいいねしたユーザー一覧"
          items:
            $ref: '#/components/schemas/User'
